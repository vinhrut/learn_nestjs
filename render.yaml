# render.yaml - Deploy Backend lên Render (free plan)
# Database KHÔNG khai báo ở đây: dùng Neon free (miễn phí vĩnh viễn), chỉ cần
# dán connection string "unpooled" vào biến DATABASE_URL trong dashboard.

services:
  - type: web
    name: learnnest-api
    env: node
    region: singapore
    plan: free
    rootDir: .

    # --include=dev là bắt buộc: NODE_ENV=production khiến npm bỏ qua
    # devDependencies, mà `nest build` nằm trong @nestjs/cli (devDependency).
    # postinstall đã tự chạy `prisma generate`.
    buildCommand: npm ci --include=dev && npm run build

    # Chạy `prisma migrate deploy` trước khi start (idempotent), nếu không
    # database sẽ rỗng và mọi query đều lỗi.
    startCommand: npm run start:migrate:prod

    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false # Neon unpooled connection string, set trong dashboard

      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      - key: SMTP_HOST
        value: smtp.gmail.com

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      # Gmail từ chối gửi nếu địa chỉ From không khớp tài khoản đã xác thực,
      # nên đặt trong dashboard cho khớp SMTP_USER.
      - key: MAIL_FROM
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      - key: OTP_TTL_MINUTES
        value: "10"

      - key: OTP_MAX_ATTEMPTS
        value: "5"

      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"

      - key: OTP_LENGTH
        value: "6"

      - key: OTP_DEBUG_LOG
        value: "false"
